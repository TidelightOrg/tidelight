name: Publish GitHub npm mirrors

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version shared by the official packages
        required: true
        type: string
      confirmation:
        description: Type PUBLISH GITHUB NPM MIRRORS to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-github-npm-mirrors-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH GITHUB NPM MIRRORS'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@tidelightorg'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shared release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = ['sdk/typescript/package.json','public/components/mcp/server/package.json','packages/react/package.json','packages/cli/package.json'];
          const versions = files.map(file => JSON.parse(fs.readFileSync(file, 'utf8')).version);
          const py = fs.readFileSync('sdk/python/pyproject.toml', 'utf8');
          versions.push(py.match(/^version\s*=\s*"([^"]+)"/m)?.[1]);
          if (versions.some(version => version !== process.env.REQUESTED_VERSION)) {
            throw new Error('The requested version does not match all five official package manifests.');
          }
          NODE
      - name: Run mother repository checks
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
      - name: Build and test all five source packages
        run: |
          set -euo pipefail
          for package in sdk/typescript public/components/mcp/server packages/react packages/cli; do
            npm ci --prefix "$package"
            npm test --prefix "$package"
          done
          PYTHONPATH=sdk/python/src python -m unittest discover -s sdk/python/tests -v
          python scripts/check-python-package.py sdk/python "$RUNNER_TEMP/tidelight-python-candidate"
      - name: Stage and validate GitHub npm mirrors
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/tidelight-github-npm-mirrors"
          mkdir -p "$OUT/staged" "$OUT/archives"
          node scripts/test-github-npm-mirror.mjs
          for mapping in "sdk/typescript sdk" "public/components/mcp/server mcp" "packages/react react" "packages/cli cli"; do
            set -- $mapping
            node scripts/prepare-github-npm-mirror.mjs "$1" "$OUT/staged/$2"
            node scripts/check-npm-package-archive.mjs "$OUT/staged/$2" "$OUT/archives"
          done
      - name: Publish or verify mirrors in dependency order
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CANDIDATE="$RUNNER_TEMP/tidelight-github-npm-mirrors/archives"
          publish_or_verify() {
            local package_name="$1" archive_name="$2" archive="$CANDIDATE/$archive_name-$RELEASE_VERSION.tgz"
            local expected actual
            expected="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
            actual="$(npm view "$package_name@$RELEASE_VERSION" dist.integrity --registry=https://npm.pkg.github.com 2>/dev/null || true)"
            if [[ -n "$actual" ]]; then
              [[ "$actual" == "$expected" ]] || { echo "$package_name@$RELEASE_VERSION exists with different content."; return 1; }
            else
              npm publish "$archive" --registry=https://npm.pkg.github.com
              for attempt in {1..12}; do
                actual="$(npm view "$package_name@$RELEASE_VERSION" dist.integrity --registry=https://npm.pkg.github.com 2>/dev/null || true)"
                [[ -n "$actual" ]] && break
                sleep 5
              done
              [[ "$actual" == "$expected" ]] || { echo "Published archive integrity could not be verified for $package_name@$RELEASE_VERSION."; return 1; }
            fi
            echo "Verified $package_name@$RELEASE_VERSION ($actual)"
          }
          publish_or_verify '@tidelightorg/sdk' "tidelightorg-sdk"
          publish_or_verify '@tidelightorg/mcp' "tidelightorg-mcp"
          publish_or_verify '@tidelightorg/react' "tidelightorg-react"
          publish_or_verify '@tidelightorg/cli' "tidelightorg-cli"
      - name: Install and smoke-test published mirrors
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CONSUMER="$RUNNER_TEMP/tidelight-github-package-consumer"
          mkdir -p "$CONSUMER"
          cd "$CONSUMER"
          npm init -y
          npm install \
            "@tidelightorg/sdk@$RELEASE_VERSION" \
            "@tidelightorg/mcp@$RELEASE_VERSION" \
            "@tidelightorg/react@$RELEASE_VERSION" \
            "@tidelightorg/cli@$RELEASE_VERSION" \
            react@19.2.8 react-dom@19.2.8
          node --input-type=module <<'NODE'
          const sdk = await import('@tidelightorg/sdk');
          const mcp = await import('@tidelightorg/mcp');
          const react = await import('@tidelightorg/react');
          if (!sdk.TidelightClient || !mcp || !react.TidelightProvider) throw new Error('One or more package entry points failed to load.');
          console.log('SDK, MCP, and React public entry points loaded successfully.');
          NODE
          ./node_modules/.bin/tidelight --help
          set +e
          mcp_output="$(./node_modules/.bin/tidelight-mcp 2>&1)"
          mcp_status=$?
          set -e
          [[ "$mcp_status" -ne 0 && "$mcp_output" == *"TIDELIGHT_API_KEY is required"* ]]
