name: Publish official packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version shared by all five package manifests
        required: true
        type: string
      confirmation:
        description: Type PUBLISH OFFICIAL PACKAGES to request the gated release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-official-packages-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH OFFICIAL PACKAGES'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate package identities, versions, and licenses
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || exit 1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = ['sdk/typescript/package.json','public/components/mcp/server/package.json','packages/react/package.json','packages/cli/package.json'];
          const expected = ['@tidelight/sdk','@tidelight/mcp','@tidelight/react','@tidelight/cli'];
          const manifests = files.map(file => [file, JSON.parse(fs.readFileSync(file, 'utf8'))]);
          const py = fs.readFileSync('sdk/python/pyproject.toml', 'utf8');
          manifests.push(['sdk/python/pyproject.toml', {
            name: py.match(/^name\s*=\s*"([^"]+)"/m)?.[1],
            version: py.match(/^version\s*=\s*"([^"]+)"/m)?.[1],
            license: 'Apache-2.0'
          }]);
          expected.push('tidelight');
          for (const [i, [file, manifest]] of manifests.entries()) {
            if (manifest.name !== expected[i] || manifest.version !== process.env.REQUESTED_VERSION || manifest.license !== 'Apache-2.0')
              throw new Error('Release metadata mismatch in ' + file);
          }
          NODE
      - name: Run mother repository checks
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
      - name: Test and archive npm packages
        run: |
          set -euo pipefail
          npm ci --prefix sdk/typescript
          npm test --prefix sdk/typescript
          npm ci --prefix public/components/mcp/server
          npm test --prefix public/components/mcp/server
          npm ci --prefix packages/react
          npm test --prefix packages/react
          npm ci --prefix packages/cli
          npm test --prefix packages/cli
          OUT="$RUNNER_TEMP/tidelight-package-candidate"
          mkdir -p "$OUT/npm" "$OUT/staged"
          for mapping in "sdk/typescript sdk" "public/components/mcp/server mcp" "packages/react react" "packages/cli cli"; do
            set -- $mapping
            node scripts/prepare-npm-package-release.mjs "$1" "$OUT/staged/$2"
            node scripts/check-npm-package-archive.mjs "$OUT/staged/$2" "$OUT/npm"
          done
      - name: Test and archive Python wheel
        run: |
          set -euo pipefail
          PYTHONPATH=sdk/python/src python -m unittest discover -s sdk/python/tests -v
          python scripts/check-python-package.py sdk/python "$RUNNER_TEMP/tidelight-package-candidate/python"
      - name: Write checksums and source record
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/tidelight-package-candidate"
          {
            printf 'Tidelight package candidate %s\n' "$RELEASE_VERSION"
            printf 'Repository: %s\nCommit: %s\nRef: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF"
          } > "$OUT/SOURCE.txt"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: tidelight-public-packages-${{ inputs.version }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tidelight-package-candidate/
          if-no-files-found: error
          retention-days: 30

  publish-npm:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH OFFICIAL PACKAGES'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable npm Trusted Publishing
        run: |
          npm install --global npm@latest
          npm config set registry https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: tidelight-public-packages-${{ inputs.version }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tidelight-package-candidate
      - name: Verify checksums
        working-directory: ${{ runner.temp }}/tidelight-package-candidate
        run: sha256sum -c SHA256SUMS
      - name: Publish npm packages in dependency order
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CANDIDATE="$RUNNER_TEMP/tidelight-package-candidate/npm"
          npm publish "$CANDIDATE/tidelight-sdk-$RELEASE_VERSION.tgz" --access public --provenance
          for attempt in {1..12}; do
            npm view "@tidelight/sdk@$RELEASE_VERSION" version >/dev/null 2>&1 && break
            sleep 5
          done
          npm view "@tidelight/sdk@$RELEASE_VERSION" version >/dev/null
          npm publish "$CANDIDATE/tidelight-mcp-$RELEASE_VERSION.tgz" --access public --provenance
          npm publish "$CANDIDATE/tidelight-react-$RELEASE_VERSION.tgz" --access public --provenance
          npm publish "$CANDIDATE/tidelight-cli-$RELEASE_VERSION.tgz" --access public --provenance

  publish-pypi:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH OFFICIAL PACKAGES'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tidelight-public-packages-${{ inputs.version }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tidelight-package-candidate
      - name: Verify checksums
        working-directory: ${{ runner.temp }}/tidelight-package-candidate
        run: sha256sum -c SHA256SUMS
      - name: Publish Python wheel using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ runner.temp }}/tidelight-package-candidate/python/
