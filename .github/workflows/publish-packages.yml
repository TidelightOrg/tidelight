name: Publish official packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version shared by all five package manifests
        required: true
        type: string
      confirmation:
        description: Type PUBLISH OFFICIAL PACKAGES to request the gated release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-official-packages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH OFFICIAL PACKAGES'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate package identities, versions, and licenses
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || exit 1
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = ['sdk/typescript/package.json','public/components/mcp/server/package.json','packages/react/package.json','packages/cli/package.json'];
          const expected = ['@tidelight/sdk','@tidelight/mcp','@tidelight/react','@tidelight/cli'];
          const manifests = files.map(file => [file, JSON.parse(fs.readFileSync(file, 'utf8'))]);
          const py = fs.readFileSync('sdk/python/pyproject.toml', 'utf8');
          manifests.push(['sdk/python/pyproject.toml', {
            name: py.match(/^name\s*=\s*"([^"]+)"/m)?.[1],
            version: py.match(/^version\s*=\s*"([^"]+)"/m)?.[1],
            license: 'Apache-2.0'
          }]);
          expected.push('tidelight');
          for (const [i, [file, manifest]] of manifests.entries()) {
            if (manifest.name !== expected[i] || manifest.version !== process.env.REQUESTED_VERSION || manifest.license !== 'Apache-2.0')
              throw new Error('Release metadata mismatch in ' + file);
          }
          NODE
      - name: Run mother repository checks
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
      - name: Test and archive npm packages
        run: |
          set -euo pipefail
          npm ci --prefix sdk/typescript
          npm test --prefix sdk/typescript
          npm ci --prefix public/components/mcp/server
          npm test --prefix public/components/mcp/server
          npm ci --prefix packages/react
          npm test --prefix packages/react
          npm ci --prefix packages/cli
          npm test --prefix packages/cli
          OUT="$RUNNER_TEMP/tidelight-package-candidate"
          mkdir -p "$OUT/npm" "$OUT/staged"
          for mapping in "sdk/typescript sdk" "public/components/mcp/server mcp" "packages/react react" "packages/cli cli"; do
            set -- $mapping
            node scripts/prepare-npm-package-release.mjs "$1" "$OUT/staged/$2"
            node scripts/check-npm-package-archive.mjs "$OUT/staged/$2" "$OUT/npm"
          done
      - name: Test and archive Python wheel
        run: |
          set -euo pipefail
          PYTHONPATH=sdk/python/src python -m unittest discover -s sdk/python/tests -v
          python scripts/check-python-package.py sdk/python "$RUNNER_TEMP/tidelight-package-candidate/python"
      - name: Write checksums and source record
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/tidelight-package-candidate"
          {
            printf 'Tidelight package candidate %s\n' "$RELEASE_VERSION"
            printf 'Repository: %s\nCommit: %s\nRef: %s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF"
          } > "$OUT/SOURCE.txt"
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: tidelight-public-packages-${{ inputs.version }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tidelight-package-candidate/
          if-no-files-found: error
          retention-days: 30

  publish-npm:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH OFFICIAL PACKAGES' && vars.TIDELIGHT_REGISTRY_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable npm Trusted Publishing
        run: |
          npm install --global npm@latest
          npm config set registry https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: tidelight-public-packages-${{ inputs.version }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tidelight-package-candidate
      - name: Verify checksums
        working-directory: ${{ runner.temp }}/tidelight-package-candidate
        run: sha256sum -c SHA256SUMS
      - name: Publish or verify npm packages in dependency order
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${NODE_AUTH_TOKEN:-}" ]] || { echo "NPM_TOKEN is required for the first-release npm publisher."; exit 1; }
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          CANDIDATE="$RUNNER_TEMP/tidelight-package-candidate/npm"
          is_pending_stage() {
            local package_name="$1"
            local latest_version description
            latest_version="$(npm view "$package_name" version 2>/dev/null || true)"
            description="$(npm view "$package_name" description 2>/dev/null || true)"
            [[ "$latest_version" == "0.0.0-stage" && "$description" == "Temporary package placeholder for staged publishing" ]]
          }
          publish_or_verify() {
            local package_name="$1"
            local archive_name="$2"
            local archive="$CANDIDATE/$archive_name-$RELEASE_VERSION.tgz"
            local expected_integrity actual_integrity
            expected_integrity="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
            actual_integrity="$(npm view "$package_name@$RELEASE_VERSION" dist.integrity 2>/dev/null || true)"
            if [[ -n "$actual_integrity" ]]; then
              [[ "$actual_integrity" == "$expected_integrity" ]] || { echo "Existing $package_name@$RELEASE_VERSION has different content."; return 1; }
              echo "$package_name@$RELEASE_VERSION already matches the approved archive; skipping."
              return 0
            fi
            if is_pending_stage "$package_name"; then
              echo "$package_name@$RELEASE_VERSION is staged and awaiting maintainer approval; skipping duplicate submission."
              return 0
            fi
            npm publish "$archive" --access public --provenance
            for attempt in {1..12}; do
              actual_integrity="$(npm view "$package_name@$RELEASE_VERSION" dist.integrity 2>/dev/null || true)"
              [[ -n "$actual_integrity" ]] && break
              sleep 5
            done
            if [[ "$actual_integrity" == "$expected_integrity" ]]; then
              return 0
            fi
            if is_pending_stage "$package_name"; then
              echo "$package_name@$RELEASE_VERSION was accepted into npm staging and awaits maintainer approval."
              return 0
            fi
            echo "Could not verify the published integrity for $package_name@$RELEASE_VERSION."
            return 1
          }
          publish_or_verify "@tidelight/sdk" "tidelight-sdk"
          publish_or_verify "@tidelight/mcp" "tidelight-mcp"
          publish_or_verify "@tidelight/react" "tidelight-react"
          publish_or_verify "@tidelight/cli" "tidelight-cli"

  publish-pypi:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH OFFICIAL PACKAGES' && vars.TIDELIGHT_REGISTRY_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tidelight-public-packages-${{ inputs.version }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tidelight-package-candidate
      - name: Verify checksums
        working-directory: ${{ runner.temp }}/tidelight-package-candidate
        run: sha256sum -c SHA256SUMS
      - name: Verify existing PyPI release or select upload
        id: pypi-check
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          wheel="$RUNNER_TEMP/tidelight-package-candidate/python/tidelight-$RELEASE_VERSION-py3-none-any.whl"
          api="https://pypi.org/pypi/tidelight/$RELEASE_VERSION/json"
          status="$(curl -sS -o "$RUNNER_TEMP/pypi-release.json" -w "%{http_code}" "$api")"
          if [[ "$status" == "404" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$status" == "200" ]] || { echo "PyPI release lookup returned HTTP $status."; exit 1; }
          python - "$RUNNER_TEMP/pypi-release.json" "$wheel" <<'PY'
          import hashlib, io, json, sys, urllib.request, zipfile
          from pathlib import Path
          from urllib.parse import urlparse

          data = json.loads(Path(sys.argv[1]).read_text())
          candidate_path = Path(sys.argv[2])
          matches = [item for item in data.get("urls", []) if item.get("filename") == candidate_path.name]
          if len(matches) != 1:
              raise SystemExit("PyPI does not expose exactly one wheel matching the candidate filename.")
          item = matches[0]
          url = urlparse(item.get("url", ""))
          if url.scheme != "https" or url.hostname != "files.pythonhosted.org":
              raise SystemExit("PyPI returned an unexpected wheel download host.")
          with urllib.request.urlopen(item["url"], timeout=30) as response:
              published_bytes = response.read()
          if hashlib.sha256(published_bytes).hexdigest() != item.get("digests", {}).get("sha256"):
              raise SystemExit("Downloaded PyPI wheel does not match the registry SHA-256 digest.")

          def wheel_members(contents):
              with zipfile.ZipFile(io.BytesIO(contents)) as archive:
                  return {name: hashlib.sha256(archive.read(name)).hexdigest() for name in archive.namelist()}

          if wheel_members(published_bytes) != wheel_members(candidate_path.read_bytes()):
              raise SystemExit("Existing PyPI wheel contents differ from the verified release candidate.")
          print("Existing PyPI wheel contents and registry digest match the verified candidate.")
          PY
          echo "publish=false" >> "$GITHUB_OUTPUT"
      - name: Publish Python wheel using PyPI Trusted Publishing
        if: steps.pypi-check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ runner.temp }}/tidelight-package-candidate/python/
