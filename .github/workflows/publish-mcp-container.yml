name: Publish Tidelight MCP container

on:
  pull_request:
    paths:
      - "public/components/mcp/server/**"
      - ".github/workflows/publish-mcp-container.yml"
  push:
    branches: [main]
    paths:
      - "public/components/mcp/server/**"
      - ".github/workflows/publish-mcp-container.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-mcp-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: public/components/mcp/server/package-lock.json
      - name: Test MCP package
        working-directory: public/components/mcp/server
        run: |
          npm ci
          npm test
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke-test container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: public/components/mcp/server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/tidelightorg/tidelight-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test container entrypoint without credentials
        run: |
          set -euo pipefail
          output="$(docker run --rm ghcr.io/tidelightorg/tidelight-mcp:ci 2>&1 || true)"
          printf '%s\n' "$output"
          [[ "$output" == *"TIDELIGHT_API_KEY is required"* ]]

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Read package version
        id: version
        working-directory: public/components/mcp/server
        run: node -p "require('./package.json').version" | sed 's/^/value=/' >> "$GITHUB_OUTPUT"
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tidelightorg/tidelight-mcp
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned, commit, and latest tags
        uses: docker/build-push-action@v6
        with:
          context: .
          file: public/components/mcp/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
