[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tidelight"
version = "0.1.0"
description = "Official Tidelight Intelligence Cloud Python client"
requires-python = ">=3.10"
readme = "README.md"
keywords = ["tidelight", "research", "market-intelligence", "webhooks"]
authors = [{ name = "TidelightOrg" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Homepage = "https://tidelight.app/developers/packages/python"
Documentation = "https://dev.tidelight.app/api"
Repository = "https://github.com/TidelightOrg/tidelight/tree/main/sdk/python"
Source = "https://github.com/TidelightOrg/tidelight/tree/main/sdk/python"
Issues = "https://github.com/TidelightOrg/tidelight/issues"

[tool.setuptools.packages.find]
where = ["src"]
